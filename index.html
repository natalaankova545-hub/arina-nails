 else if(S.step==2){const y=S.month.getFullYear(),mo=S.month.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate(),today=new Date();today.setHours(0,0,0,0);const max=new Date(today);max.setDate(max.getDate()+C.booking.daysAhead);
  h+=`<h3>${t("s2")}</h3>${errHtml()}<div class="mh" style="margin-top:14px"><button data-mv="-1" aria-label="${t("prevAria")}">‹</button><b>${S.month.toLocaleDateString(LOC[LANG],{month:"long",year:"numeric"})}</b><button data-mv="1" aria-label="${t("nextAria")}">›</button></div><div class="cal">`+t("wdShort").map(x=>`<b>${x}</b>`).join("")+"<span></span>".repeat(first);
  for(let d=1;d<=n;d++){const dt=new Date(y,mo,d),ok=dt>=today&&dt<=max&&slots(dt,S.svc).length>0;h+=`<button ${ok?"":"disabled"} data-d="${iso(dt)}" class="${S.date==iso(dt)?"sel":""}">${d}</button>`}
  h+=`</div>`;
  if(S.date){const dt=new Date(S.date+"T00:00"),sl=slots(dt,S.svc);h+=`<h3 style="margin-top:20px;font-size:1.2rem">${t("freeTime")}</h3><div class="slots">`+(sl.length?sl.map(x=>`<button data-t="${x}" class="${S.time===x?"sel":""}">${hm(x)}</button>`).join(""):t("noSlots"))+`</div>`}}
 if(S.step==3)h+=`<h3>${t("s3")}</h3><label for="fn">${t("lblName")}</label><input id="fn" autocomplete="name" value="${esc(S.name)}"><div class="err" id="e1"></div><label for="fp">${t("lblPhone")}</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel" value="${esc(S.phone)}"><div class="err" id="e2"></div><label for="fe">${t("lblEmail")}</label><input id="fe" type="email" autocomplete="email" value="${esc(S.email)}"><div class="err" id="e3"></div><label for="fc2">${t("lblComment")}</label><textarea id="fc2" rows="3">${esc(S.comment)}</textarea>`;
 if(S.step==4){const D=t("dlSum");h+=`<h3>${t("s4")}</h3><dl style="margin-top:14px"><dt>${D[0]}</dt><dd>${esc(L(S.svc.name))}</dd><dt>${D[1]}</dt><dd>${fmtDate(S.date)}</dd><dt>${D[2]}</dt><dd>${hm(S.time)}–${hm(S.time+S.svc.min)} (${S.svc.min} ${t("min")})</dd><dt>${D[3]}</dt><dd>${money(S.svc)}</dd><dt>${D[4]}</dt><dd>${esc(S.name)}</dd><dt>${D[5]}</dt><dd>${esc(S.phone)}</dd></dl>`+errHtml()}
 const can=S.step==1?!!S.svc:S.step==2?S.time!=null:true;
 h+=`<div class="nav2">${S.step>1?`<button class="btn ghost" data-nav="-1">${t("back")}</button>`:"<span></span>"}<button class="btn" data-nav="1" ${can&&!S.busy?"":"disabled"}>${S.step==4?(S.busy?t("sending"):t("confirm")):t("next")}</button></div>`;
 bk.innerHTML=h}
bk.onclick=async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.retry){return refreshBusy()}
 else if(b.dataset.s){S.svc=C.services.find(s=>s.id==b.dataset.s);S.date=S.time=null}
 else if(b.dataset.mv){S.month.setMonth(S.month.getMonth()+ +b.dataset.mv)}
 else if(b.dataset.d){S.date=b.dataset.d;S.time=null}
 else if(b.dataset.t){S.time=+b.dataset.t}
 else if(b.dataset.nav){const dir=+b.dataset.nav;
  if(S.step==3&&dir>0&&!saveForm())return;
  if(S.step==4&&dir>0){return submit()}
  S.step+=dir;S.err="";if(S.step==2&&dir>0){return refreshBusy()}}
 else return;render()};
function saveForm(){S.name=$("#fn").value.trim();S.phone=$("#fp").value.trim();S.email=$("#fe").value.trim();S.comment=$("#fc2").value.trim();let ok=true;
 $("#e1").textContent=S.name.length<2?(ok=false,t("vName")):"";
 $("#e2").textContent=S.phone.replace(/\D/g,"").length<10?(ok=false,t("vPhone")):"";
 $("#e3").textContent=S.email&&!/^\S+@\S+\.\S+$/.test(S.email)?(ok=false,t("vEmail")):"";return ok}
async function submit(){S.err="";
 S.busy=true;render();
 try{const r=await rpc("book_slot",{p_service:S.svc.id,p_date:S.date,p_start:hm(S.time),p_name:S.name,p_phone:S.phone,p_email:S.email||null,p_comment:S.comment||null});
  if(r&&r.error=="slot_taken"){S.busy=false;S.step=2;S.time=null;S.err="taken";await refreshBusy();return}
  if(!r||r.ok!==true){S.err=(r&&T.ru["e_"+r.error])?r.error:"saveFail";S.busy=false;return render()}
  BUSY.push({date:S.date,from:hm(S.time),to:hm(S.time+S.svc.min)});
  S.done={date:S.date,time:S.time}}
 catch(_){S.err="netFail"}
 S.busy=false;render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-svc]");if(!b)return;S.svc=C.services.find(s=>s.id==b.dataset.svc);S.step=2;S.date=S.time=null;S.done=null;S.err="";refreshBusy();$("#booking").scrollIntoView()});
renderStatic();
</script>
</body>
</html>
